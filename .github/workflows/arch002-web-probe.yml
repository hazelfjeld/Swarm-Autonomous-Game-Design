                  assert json.loads(large_recovery["observed"]["active"])["model"] == expected_large
                  assert large_recovery["observed"]["previous"] == large_corrupt["previous"]
                  assert json.loads(large_recovery["archive"]) == {"version":1,"activePresent":True,"previousPresent":True,**large_corrupt}
                  modal_click(800, 685)
                  wait(bounds, "large recovery reload")
                  wait(lambda: ready("backup"), "large recovery reopened")
                  assert saved()["active"]["model"]["receipts"] == fixture["receipts"]
                  assert raw_city_pair()["archive"] == large_recovery["archive"]
                  capture("large-recovery-reloaded")
                  large_report = {"large_city_browser":"pass","seed_bytes":seed_bytes,"receipts":13000,
                      "seeded_native_fixture":True,"preview_preserved":True,"restored":True,
                      "clipboard_roundtrip":{"method":"Chromium WebDriver keyboard + browser clipboard readback",
                          "cleared_preview_rejected":True,"exact_text_equal":True,
                          "bytes":len(copied_backup.encode("utf-8")),"sha256":clipboard_digest},
                      "archive_preserved":True,"reopened":True,"elapsed_seconds":large_times,
                      "actual_site_verified":False}
                  (evidence/"large-city-browser.json").write_text(json.dumps(large_report,indent=2))
                  print(json.dumps(large_report), flush=True)
                  # Isolated final browser fault: a genuine IndexedDB versionchange
                  # after an acknowledged save and armed, visible backup preview.
                  # Never upgrade a profile used by any other scenario or player.
                  api("DELETE", session)
                  session = None
                  idle_profile = pathlib.Path(compact_profiles) / "idle-invalidation"
                  idle_profile.mkdir()
                  idle_opened = api("POST", "/session", {"capabilities":{"alwaysMatch":{"browserName":"chrome",
                      "goog:chromeOptions":{"args":["--headless=new","--window-size=1200,1000",
                          "--disable-dev-shm-usage","--user-data-dir="+str(idle_profile)]}}}})
                  session = "/session/" + idle_opened["sessionId"]
                  api("POST", session + "/timeouts", {"script":15000,"pageLoad":30000})
                  api("POST", session + "/goog/cdp/execute", {"cmd":"Emulation.setDeviceMetricsOverride",
                      "params":{"width":1100,"height":880,"deviceScaleFactor":1,"mobile":False}})
                  api("POST", session + "/url", {"url":url})
                  wait(bounds, "idle invalidation loader")
                  observe(lambda m: m["gold"] == 1200 and m["food"] == 240, "idle fixture fresh city")
                  click("feed", 830, 363)
                  observe(lambda m: m["food"] == 235, "idle fixture previous-good")
                  compact_click("backup", "backup")
                  wait(lambda: view()["backup_open"] and view()["phase"] == "ready", "idle backup opened")
                  compact_click("export")
                  wait(lambda: view()["backup_message"].startswith("Confirmed backup exported"), "idle backup exported")
                  compact_click("preview")
                  before_idle = wait(lambda: (v if (v := view()) and v["phase"] == "ready" and not v["backup_restore_disabled"]
                      and v["backup_message"].startswith("Replace current city") else None), "idle preview armed")
                  capture("idle-backup-before")
                  def idle_raw_records(version=None):
                      return clipboard_call("""
                        const version = arguments[0], name = "little-ray-city-checkpoint-v2";
                        const operation = (async () => {
                          const db = await new Promise((ok,bad) => {
                            const req = version === null ? indexedDB.open(name) : indexedDB.open(name,version);
                            req.onsuccess = () => ok(req.result);
                            req.onerror = () => bad(req.error);
                            req.onblocked = () => bad(Error("upgrade blocked"));
                            req.onupgradeneeded = e => {
                              if (version !== 2 || e.oldVersion !== 1 || e.newVersion !== 2) req.transaction.abort();
                            };
                          });
                          try {
                            return await new Promise((ok,bad) => {
                              const tx = db.transaction("profiles","readonly"), store = tx.objectStore("profiles");
                              const keys = ["active","previous","recovery-original"];
                              const values = keys.map(key => store.get(key)), present = keys.map(key => store.getKey(key));
                              tx.oncomplete = () => ok({version:db.version,records:keys.map((key,i) => ({
                                key,present:present[i].result !== undefined,value:values[i].result ?? null
                              }))});
                              tx.onabort = tx.onerror = () => bad(tx.error);
                            });
                          } finally { db.close(); }
                        })();
                      """, (version,))
                  idle_pair = idle_raw_records()
                  assert idle_pair["version"] == 1 and all(x["present"] for x in idle_pair["records"][:2])
                  assert not idle_pair["records"][2]["present"], "Idle fixture must not share a recovered profile"
                  idle_upgraded = idle_raw_records(2)
                  assert idle_upgraded["version"] == 2 and idle_upgraded["records"] == idle_pair["records"], "Upgrade changed durable records"
                  def idle_fenced():
                      v = view()
                      return v if v and v["phase"] == "unavailable" and v["backup_open"] and v["backup_restore_disabled"] and v["disabled"]["backup"] and "Save unavailable" in v["backup_message"] else None
                  idle_fenced_view = wait(idle_fenced, "idle invalidation visible in backup UI")
                  assert idle_fenced_view["domain_revision"] == before_idle["domain_revision"], "Invalidation changed visible confirmed revision"
                  capture("idle-backup-invalidated")
                  compact_click("restore")
                  time.sleep(.35)
                  assert idle_fenced() and view()["domain_revision"] == before_idle["domain_revision"]
                  assert idle_raw_records() == idle_upgraded, "Disabled restore changed durable records"
                  compact_click("close")
                  # Terminal overlay is the input fence; raw widget disabled flags describe
                  # economic eligibility and may legitimately remain false.
                  def idle_closed_fence():
                      v = view()
                      return v if v and not v["backup_open"] and v["phase"] == "unavailable" and v["overlay"] and v["disabled"]["backup"] and "Save unavailable" in v["footer"] else None
                  idle_closed = wait(idle_closed_fence, "closed modal retains terminal overlay")
                  idle_kinds = ("feed", "plant", "collect", "harvest")
                  def idle_assert_fence(label):
                      v = idle_closed_fence()
                      assert v, (label, "terminal overlay lost", view())
                      assert v["domain_revision"] == before_idle["domain_revision"], (label, "visible revision changed")
                      assert not v["pending_kind"], (label, "economic action pending")
                      for counter in ("downs", "presses"):
                          assert all(v[counter][k] == before_idle[counter][k] for k in idle_kinds), (label, counter, v[counter], before_idle[counter])
                      assert idle_raw_records() == idle_upgraded, (label, "durable active/previous/archive changed")
                      return v
                  idle_assert_fence("close")
                  capture("idle-backup-closed")
                  # Use browser-delivered W3C input, not JS-dispatched events or game commands.
                  # Audit real events at capture phase; a no-op test driver must not pass.
                  assert js("""
                      window.arch002IdleInput = [];
                      for (const type of ["pointerdown", "keydown"]) window.addEventListener(type, e => {
                          window.arch002IdleInput.push({type, trusted:e.isTrusted,
                              canvas:e.target===document.querySelector("canvas"),
                              key:e.key??null, x:e.clientX??null, y:e.clientY??null});
                      }, true);
                      return true;
                  """)
                  import re as idle_re
                  idle_attempts = []
                  for kind in ("feed", "plant"):
                      v = idle_assert_fence(kind + " before")
                      # Parse the exact diagnostic Rect2 format; fail closed on missing geometry.
                      m = idle_re.fullmatch(r"\[P: \(([-0-9.]+), ([-0-9.]+)\), S: \(([-0-9.]+), ([-0-9.]+)\)\]", v["rects"][kind])
                      assert m, (kind, v["rects"][kind])
                      x,y,w,h = map(float,m.groups())
                      vw,vh = v["viewport_size"]
                      assert w>0 and h>0 and 0<=x<x+w<=vw and 0<=y<y+h<=vh, (kind, x,y,w,h,vw,vh)
                      b = bounds()
                      assert b and b["width"]>0 and b["height"]>0
                      expected_x = b["x"] + b["width"]*(x+w/2)/vw
                      expected_y = b["y"] + b["height"]*(y+h/2)/vh
                      n = len(js("return window.arch002IdleInput;"))
                      # modal_click uses normalized desktop coordinates and does not wait for readiness.
                      modal_click((x+w/2)*1100/vw, (y+h/2)*880/vh)
                      time.sleep(.25)
                      events = js("return window.arch002IdleInput;")[n:]
                      assert any(e["type"]=="pointerdown" and e["trusted"] and e["canvas"] and abs(e["x"]-expected_x)<=2 and abs(e["y"]-expected_y)<=2 for e in events), (kind, "pointer did not reach intended canvas point", events)
                      idle_assert_fence(kind + " pointer")
                      n = len(js("return window.arch002IdleInput;"))
                      key_press("\uE007")  # Enter
                      key_press("\uE00D")  # Space
                      time.sleep(.25)
                      events = js("return window.arch002IdleInput;")[n:]
                      assert all(any(e["type"]=="keydown" and e["trusted"] and e["canvas"] and e["key"]==key for e in events) for key in ("Enter", " ")), (kind, "keyboard delivery not demonstrated", events)
                      idle_assert_fence(kind + " keyboard")
                      # Browser-handled Tab may leave canvas; record rather than mislabel focus.
                      n = len(js("return window.arch002IdleInput;"))
                      key_press("\uE004")  # Tab
                      key_press("\uE007")
                      key_press("\uE00D")
                      time.sleep(.25)
                      traversal = js("return window.arch002IdleInput;")[n:]
                      idle_assert_fence(kind + " focus traversal")
                      idle_attempts.append({"kind":kind,"target_css":[expected_x,expected_y],"pointer_delivered":True,
                          "enter_space_delivered_to_canvas":True,"focus_traversal_events":traversal})
                  idle_assert_fence("final")
                  capture("idle-backup-fence-inputs")
                  idle_report = {"idle_backup_invalidation":"pass","fresh_disposable_profile":True,
                      "real_indexeddb_upgrade":[1,2],"preview_armed_before_fault":True,
                      "visible_unavailable":True,"restore_disabled":True,"city_action_fence_after_close":True,
                      "input_attempts":idle_attempts,"confirmed_revision_unchanged":True,
                      "exact_active_previous_archive_preserved":True,"actual_site_verified":False}
                  (evidence/"idle-backup-invalidation.json").write_text(json.dumps(idle_report,indent=2))
                  print(json.dumps(idle_report), flush=True)
          except Exception as error:
              if session:
                  try:
                      capture("99-failure")
                      record("failure: " + str(error))
                  except Exception as diagnostic_error:
                      print("Failure evidence capture:", diagnostic_error, flush=True)
              raise
          finally:
              if session:
                  try:
                      api("DELETE", session)
                  except Exception as error:
                      print("Browser cleanup:", error, flush=True)
              driver.terminate()
              try:
                  driver.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  driver.kill()
                  driver.wait()
              server.shutdown()
              # Retain renderer phase markers even when WebDriver cannot respond.
              # Print only the structured marker, not arbitrary browser log text.
              import re
              trace_path = evidence/"large-chrome.log"
              if trace_path.exists():
                  markers = re.findall(r"LR_EXPORT_TRACE stage=[a-z_]+ ticks_ms=\d+ chars=-?\d+",
                      trace_path.read_text(errors="replace"))
                  (evidence/"large-export-trace.json").write_text(json.dumps(markers, indent=2))
                  print(json.dumps({"large_export_trace":markers}), flush=True)
              else:
                  print("Large export renderer log unavailable", flush=True)
          PY
      - name: Retain combined city export and browser evidence (not hosted)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arch002-persistent-city-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/arch002-persistent-city/
            ${{ runner.temp }}/arch002-city-browser-evidence/
          if-no-files-found: warn
          retention-days: 3
