name: ARCH-002 exact-head Godot web probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'spikes/web_delivery/**'
      - 'tests/arch002_city_bridge.gd'
      - 'tests/arch002_city_session_test.gd'
      - 'integration/arch002/**'
      - 'tests/arch002_profile_transport_browser.js'
      - '.github/workflows/arch002-web-probe.yml'

permissions:
  contents: read

concurrency:
  group: arch002-web-probe
  cancel-in-progress: true

jobs:
  web-probe:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'swarm/architect/ARCH-002'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact submitted commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify checkout and Python version
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
      - name: Obtain verified official editor and templates
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir arch002-engine arch002-templates
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 420 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o editor.zip
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 600 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          printf '%s\n' 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  editor.zip' 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz' | sha256sum --check --strict
          unzip -q editor.zip -d arch002-engine
          chmod +x arch002-engine/Godot_v4.7.2-stable_linux.x86_64
          unzip -j -q templates.tpz templates/version.txt templates/web_nothreads_release.zip templates/web_nothreads_debug.zip -d arch002-templates
          test "$(arch002-engine/Godot_v4.7.2-stable_linux.x86_64 --version)" = '4.7.2.stable.official.ed1daf0bf'
      - name: Exercise build-helper fixture tests
        run: python3 -B spikes/web_delivery/test_reproduce_export.py
      - name: Native import, store tests, scene smoke and web export
        run: |
          set -euo pipefail
          python3 spikes/web_delivery/reproduce_export.py --godot "$RUNNER_TEMP/arch002-engine/Godot_v4.7.2-stable_linux.x86_64" --templates "$RUNNER_TEMP/arch002-templates"
      - name: Retain exact-head export and manifest (not a deployment)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arch002-web-${{ github.event.pull_request.head.sha }}
          path: spikes/web_delivery/build/${{ github.event.pull_request.head.sha }}/
          if-no-files-found: error
          retention-days: 3

      - name: Browser smoke on the authorized CI runner (not Site hosting)
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        timeout-minutes: 7
        run: |
          set -euo pipefail
          command -v google-chrome
          command -v chromedriver
          google-chrome --version
          chromedriver --version
          python3 - <<'PY'
          import base64
          import functools
          import hashlib
          import http.server
          import json
          import os
          import pathlib
          import signal
          import subprocess
          import tempfile
          import threading
          import time
          import urllib.error
          import urllib.request

          root = pathlib.Path("spikes/web_delivery/build") / os.environ["EXPECTED_HEAD"]
          manifest = json.loads((root / "build-manifest.json").read_text())
          assert manifest["source_commit"] == os.environ["EXPECTED_HEAD"]
          for name, entry in manifest["files"].items():
              data = (root / name).read_bytes()
              assert len(data) == entry["bytes"], name
              assert hashlib.sha256(data).hexdigest() == entry["sha256"], name

          class Handler(http.server.SimpleHTTPRequestHandler):
              def log_message(self, fmt, *args):
                  print("HTTP:", fmt % args, flush=True)

          # Bind only to the ephemeral CI runner, never to a public interface.
          server = http.server.ThreadingHTTPServer(
              ("127.0.0.1", 0), functools.partial(Handler, directory=str(root)))
          threading.Thread(target=server.serve_forever, daemon=True).start()
          url = f"http://127.0.0.1:{server.server_port}/index.html"
          driver = subprocess.Popen(["chromedriver", "--port=9515"])
          session = None
          def api(method, path, value=None):
              req = urllib.request.Request("http://127.0.0.1:9515" + path,
                  data=None if value is None else json.dumps(value).encode(),
                  headers={"Content-Type": "application/json"}, method=method)
              with urllib.request.urlopen(req, timeout=35) as response:
                  return json.load(response)["value"]

          def until(fn, label, seconds=35):
              deadline = time.monotonic() + seconds
              while time.monotonic() < deadline:
                  result = fn()
                  if result:
                      return result
                  time.sleep(0.5)
              raise AssertionError("Timed out: " + label)

          def script(source, args=None):
              return api("POST", session + "/execute/sync",
                         {"script": source, "args": args or []})

          def saved(filename="delivery_probe.json"):
              # Inspect the browser's persisted IDBFS data, not a synthetic
              # page variable, a save-button receipt, or a mocked filesystem.
              return api("POST", session + "/execute/async", {"args": [filename], "script": """
                const filename = arguments[0];
                const done = arguments[arguments.length - 1];
                (async () => {
                  for (const info of await indexedDB.databases()) {
                    if (!info.name) continue;
                    const db = await new Promise((resolve, reject) => {
                      const r = indexedDB.open(info.name);
                      r.onsuccess = () => resolve(r.result);
                      r.onerror = () => reject(r.error);
                    });
                    try {
                      if (!db.objectStoreNames.contains('FILE_DATA')) continue;
                      const records = await new Promise((resolve, reject) => {
                        const matches = [];
                        const r = db.transaction('FILE_DATA', 'readonly')
                                    .objectStore('FILE_DATA').openCursor();
                        r.onerror = () => reject(r.error);
                        r.onsuccess = () => {
                          const c = r.result;
                          if (!c) return resolve(matches);
                          if (String(c.key).endsWith('/' + filename) &&
                              c.value && c.value.contents) {
                            matches.push(JSON.parse(new TextDecoder().decode(c.value.contents)));
                          }
                          c.continue();
                        };
                      });
                      if (records.length === 1) return records[0];
                      if (records.length > 1) throw new Error('Ambiguous persisted probe');
                    } finally { db.close(); }
                  }
                  return null;
                })().then(done, e => done({browser_error: String(e)}));
              """})

          def click(x, y):
              api("POST", session + "/actions", {"actions": [{
                  "type": "pointer", "id": "mouse", "parameters": {"pointerType": "mouse"},
                  "actions": [{"type": "pointerMove", "duration": 0, "origin": "viewport",
                               "x": x, "y": y},
                              {"type": "pointerDown", "button": 0},
                              {"type": "pointerUp", "button": 0}]}]})

          def canvas_ready():
              # The pinned Godot HTML shell removes #status when Engine.startGame resolves.
              return script("""
                const c = document.querySelector('canvas');
                const s = document.getElementById('status');
                return c && c.width > 0 && c.height > 0 &&
                       !s
                  ? c.getBoundingClientRect().toJSON() : null;
              """)

          def same_payload(a, b):
              return {k: v for k, v in a.items() if k != "revision"} == {k: v for k, v in b.items() if k != "revision"}

          def greeting_count(n):
              value = saved()
              if value and value.get("browser_error"):
                  raise RuntimeError(value["browser_error"])
              return value if value and value.get("greetings") == n else None

          try:
              # Keep the normal Chrome sandbox and browser policy intact.
              with tempfile.TemporaryDirectory(prefix="arch002-chrome-") as profile:
                  def driver_ready():
                      try:
                          return api("GET", "/status").get("ready")
                      except OSError:
                          return False
                  until(driver_ready, "ChromeDriver readiness", 15)
                  opened = api("POST", "/session", {"capabilities": {"alwaysMatch": {
                      "browserName": "chrome", "goog:chromeOptions": {"args": [
                          "--headless=new", "--window-size=900,1000",
                          "--disable-dev-shm-usage", "--user-data-dir=" + profile]}}}})
                  session = "/session/" + opened["sessionId"]
                  print("Browser:", opened["capabilities"].get("browserVersion"), flush=True)
                  api("POST", session + "/timeouts", {"script": 10000, "pageLoad": 30000})
                  api("POST", session + "/goog/cdp/execute", {"cmd": "Emulation.setDeviceMetricsOverride",
                      "params": {"width": 720, "height": 820, "deviceScaleFactor": 1, "mobile": False}})
                  api("POST", session + "/url", {"url": url})
                  bounds = until(canvas_ready, "Godot loader completion")
                  print("Canvas bounds:", bounds, flush=True)
                  assert saved() is None, "Fresh browser profile unexpectedly contains a save"
                  # Normal mouse input at the greeting button in the 720x820
                  # diagnostic scene. The coordinate is a fixture, not proof
                  # of arbitrary layouts or touch support. Fail closed if wrong.
                  def greet():
                      b = until(canvas_ready, "canvas after navigation")
                      click(round(b["x"] + b["width"] * 0.5),
                            round(b["y"] + b["height"] * (335 / 820)))
                  greet()
                  first = until(lambda: greeting_count(1), "first greeting persisted in IndexedDB")
                  assert first["individual"]["ray_id"] == "probe_ray_001"
                  assert first["revision"] == 1
                  def confirmed(revision):
                      return script("""
                        const badge = document.getElementById('save-confirmation');
                        return !badge.hidden && badge.dataset.state === 'saved' &&
                            badge.dataset.revision === String(arguments[0]) &&
                            badge.textContent === 'Saved revision ' + arguments[0];
                      """, [revision])
                  assert until(lambda: confirmed(first["revision"]), "first exact durable-save confirmation")
                  print("First greeting persisted and confirmed.", flush=True)
                  api("POST", session + "/refresh", {})
                  until(canvas_ready, "Godot loader after reload")
                  greet()
                  second = until(lambda: greeting_count(2), "second greeting after reload")
                  assert second["individual"] == first["individual"]
                  assert second["revision"] == first["revision"] + 1
                  assert until(lambda: confirmed(second["revision"]), "second exact durable-save confirmation")
                  print(json.dumps({"durable_save_confirmation": "pass", "revision": second["revision"], "actual_site_verified": False}), flush=True)
                  # Exercise the real diagnostic job via its normal UI controls.
                  # Fixed viewport fixture; persisted state is the assertion,
                  # never the click itself. Do not inject clocks or save data.
                  def timer_phase(phase):
                      value = saved()
                      if value and value.get("browser_error"):
                          raise RuntimeError(value["browser_error"])
                      if value and value.get("timer", {}).get("phase") == phase:
                          assert value["individual"] == second["individual"]
                          assert value["greetings"] == 2
                          return value
                      return None

                  def timer_button(y):
                      b = until(canvas_ready, "canvas for timer action")
                      click(round(b["x"] + b["width"] * 0.5),
                            round(b["y"] + b["height"] * (y / 820)))

                  assert second["timer"]["phase"] == "idle", second
                  timer_button(435)
                  running = until(lambda: timer_phase("running"), "timer start persisted", 15)
                  assert 0 < running["timer"]["remaining_ms"] <= 10000, running
                  assert running["timer"]["wall_marker_ms"] > 0, running
                  print("Timer start persisted:", running["timer"], flush=True)

                  # Unload the game completely before the deadline and return
                  # after real elapsed wall time. This is not a background-tab
                  # test or a mocked offline-time calculation.
                  api("POST", session + "/url", {"url": "about:blank"})
                  assert script("return document.querySelector('canvas') === null")
                  time.sleep(11)
                  api("POST", session + "/url", {"url": url})
                  until(canvas_ready, "Godot loader after offline interval")
                  ready = until(lambda: timer_phase("ready"), "offline timer completion persisted")
                  assert ready["timer"]["remaining_ms"] == 0, ready
                  assert ready["timer"]["wall_marker_ms"] >= running["timer"]["wall_marker_ms"]
                  print("Offline timer completion persisted:", ready["timer"], flush=True)

                  timer_button(495)
                  claimed = until(lambda: timer_phase("claimed"), "timer claim persisted")
                  assert claimed["timer"]["remaining_ms"] == 0, claimed
                  assert claimed["timer"]["wall_marker_ms"] == ready["timer"]["wall_marker_ms"]
                  # Repeated normal clicks and a subsequent reload must not
                  # change the completed diagnostic record.
                  timer_button(495)
                  time.sleep(2)
                  assert saved() == claimed, "Repeated claim changed the committed record"
                  api("POST", session + "/refresh", {})
                  until(canvas_ready, "Godot loader after claimed timer reload")
                  assert until(lambda: timer_phase("claimed"), "claimed timer after reload") == claimed
                  timer_button(495)
                  time.sleep(2)
                  assert saved() == claimed, "Claim after reload changed the committed record"
                  print(json.dumps({"browser_timer": "pass", "source_commit": manifest["source_commit"],
                      "observations": ["normal start", "persisted running phase", "unloaded interval",
                                       "persisted ready phase", "normal claim", "repeated claim and reload"],
                      "actual_site_verified": False}), flush=True)
                  # Real UI backup round-trip, not an injected profile.
                  evidence = pathlib.Path(os.environ["RUNNER_TEMP"]) / "arch002-browser-evidence"
                  evidence.mkdir(exist_ok=True)

                  def screenshot(name):
                      (evidence / (name + ".png")).write_bytes(
                          base64.b64decode(api("GET", session + "/screenshot")))

                  def keys(*values):
                      events = []
                      for value in values:
                          events.extend([{"type": "keyDown", "value": value},
                                         {"type": "keyUp", "value": value}])
                      api("POST", session + "/actions", {"actions": [
                          {"type": "key", "id": "keyboard", "actions": events}]})

                  def scroll_bottom():
                      # Scroll over the title region rather than the editable
                      # backup text, which has its own scrolling behavior.
                      b = until(canvas_ready, "canvas for scrolling")
                      for _ in range(6):
                          api("POST", session + "/actions", {"actions": [{
                              "type": "wheel", "id": "wheel",
                              "actions": [{"type": "scroll", "origin": "viewport",
                                  "x": round(b["x"] + b["width"] * 0.5),
                                  "y": round(b["y"] + b["height"] * (80 / 820)),
                                  "deltaX": 0, "deltaY": 500, "duration": 100}]}]})
                      time.sleep(0.5)

                  def preview_backup():
                      # At the bottom, preview is immediately above the
                      # save-failure checkbox. Keep this fixed-layout fixture
                      # consistent for the valid and corrupt cases.
                      timer_button(752)
                      time.sleep(0.5)

                  timer_button(590)  # Export the two-greeting, claimed timer record.
                  screenshot("01-export")
                  greet()
                  third = until(lambda: greeting_count(3), "post-export greeting persisted")
                  assert third["individual"] == claimed["individual"]
                  assert third["timer"] == claimed["timer"]
                  assert until(lambda: saved("delivery_probe.json.previous") == claimed,
                               "previous-good copy after greeting")
                  scroll_bottom()
                  preview_backup()
                  screenshot("02-preview-before-confirm")
                  assert saved() == third, "Preview changed active profile before confirmation"
                  keys("\ue00c")  # Escape cancels the confirmation dialog.
                  time.sleep(0.5)
                  assert saved() == third, "Cancel changed active profile"
                  preview_backup()
                  keys("\ue007")  # Enter accepts the normal confirmation dialog.
                  restored = until(lambda: greeting_count(2), "confirmed backup restore persisted")
                  assert same_payload(restored, claimed), "Backup restore changed identity or timer"
                  assert restored["revision"] == third["revision"] + 1, "Backup rewound revision"
                  assert until(lambda: saved("delivery_probe.json.previous") == third,
                               "previous-good copy retained after restore")
                  screenshot("03-restored")
                  api("POST", session + "/refresh", {})
                  until(canvas_ready, "loader after backup restore")
                  assert until(lambda: greeting_count(2), "restored profile after reload") == restored

                  # The backup textbox starts empty after reload. Type malformed
                  # JSON via real keyboard events; do not edit IndexedDB.
                  timer_button(680)
                  keys(*"not-json")
                  scroll_bottom()
                  preview_backup()
                  screenshot("04-corrupt-preview")
                  keys("\ue007")
                  time.sleep(2)
                  assert saved() == restored, "Malformed import changed active profile"
                  assert saved("delivery_probe.json.previous") == third, "Malformed import changed previous-good copy"
                  api("POST", session + "/refresh", {})
                  until(canvas_ready, "loader after malformed import")
                  assert until(lambda: greeting_count(2), "unchanged profile after malformed import") == restored
                  print(json.dumps({"browser_backup": "pass", "source_commit": manifest["source_commit"],
                      "observations": ["export UI", "preview nonmutation", "cancel nonmutation",
                                       "confirmed restore", "previous-good copy", "reload",
                                       "malformed input attempt and unchanged records"],
                      "visual_status_review_required": True, "actual_site_verified": False}), flush=True)
                  # Real UI failure simulation, not a browser storage fault injection.
                  # The timer is already claimed, so no autonomous checkpoint
                  # can legitimately change either record during this test.
                  def scroll_top():
                      b = until(canvas_ready, "canvas for upward scrolling")
                      for _ in range(6):
                          api("POST", session + "/actions", {"actions": [{
                              "type": "wheel", "id": "wheel",
                              "actions": [{"type": "scroll", "origin": "viewport",
                                  "x": round(b["x"] + b["width"] * 0.5),
                                  "y": round(b["y"] + b["height"] * (80 / 820)),
                                  "deltaX": 0, "deltaY": -500, "duration": 100}]}]})
                      time.sleep(0.5)

                  def toggle_save_failure():
                      scroll_bottom()
                      # Bottom row of the existing 720x820 fixture.
                      timer_button(805)
                      time.sleep(0.5)
                      scroll_top()

                  before_failure = saved()
                  previous_before_failure = saved("delivery_probe.json.previous")
                  assert before_failure == restored
                  assert previous_before_failure == third
                  toggle_save_failure()
                  screenshot("05-failure-enabled")
                  greet()
                  time.sleep(2)
                  screenshot("06-failed-greeting")
                  assert saved() == before_failure, "Failed greeting changed active profile"
                  assert saved("delivery_probe.json.previous") == previous_before_failure, (
                      "Failed greeting changed previous-good profile")
                  toggle_save_failure()
                  screenshot("07-failure-disabled")
                  # A successful retry in the same scene must apply exactly
                  # one greeting, not accumulate the rejected candidate.
                  greet()
                  retried = until(lambda: greeting_count(3), "greeting after disabling simulated failure")
                  assert same_payload(retried, third), "Successful retry did not preserve identity and timer"
                  assert retried["revision"] == before_failure["revision"] + 1
                  assert until(lambda: saved("delivery_probe.json.previous") == before_failure,
                               "previous-good copy after retry")
                  screenshot("08-retry-saved")
                  api("POST", session + "/refresh", {})
                  until(canvas_ready, "loader after successful retry")
                  assert until(lambda: greeting_count(3), "successful retry after reload") == retried
                  assert saved("delivery_probe.json.previous") == before_failure
                  print(json.dumps({"browser_simulated_write_failure": "pass",
                      "source_commit": manifest["source_commit"],
                      "observations": ["failure toggle", "attempted normal greeting",
                                       "active and previous-good unchanged", "same-scene retry once",
                                       "reload after successful retry"],
                      "visual_status_review_required": True, "real_browser_storage_fault_verified": False,
                      "actual_site_verified": False}), flush=True)
                  # Verify two real documents in the same browser profile.
                  owner = api("GET", session + "/window")
                  other = api("POST", session + "/window/new", {"type": "tab"})["handle"]
                  def switch(handle):
                      api("POST", session + "/window", {"handle": handle})
                      api("POST", session + "/goog/cdp/execute", {"cmd": "Emulation.setDeviceMetricsOverride",
                          "params": {"width": 720, "height": 820, "deviceScaleFactor": 1, "mobile": False}})
                  def writer_state():
                      return script("return document.body.dataset.writerState")
                  def retry_writer():
                      el = api("POST", session + "/element",
                               {"using": "css selector", "value": "#writer-retry"})
                      key = el["element-6066-11e4-a52e-4f735466cecf"]
                      api("POST", session + "/element/" + key + "/click", {})
                  switch(other)
                  api("POST", session + "/url", {"url": url})
                  until(lambda: writer_state() == "busy", "second tab read-only")
                  assert not canvas_ready() and script("return window.littleRayProbeWriter") is False
                  assert saved() == retried
                  retry_writer()
                  until(lambda: writer_state() == "busy", "takeover refused while owner lives")
                  assert not canvas_ready() and saved() == retried
                  switch(owner)
                  assert writer_state() == "writer"
                  greet()
                  fourth = until(lambda: greeting_count(4), "original writer persists after refused takeover")
                  assert fourth["revision"] == retried["revision"] + 1
                  assert until(lambda: saved("delivery_probe.json.previous") == retried, "old writer recovery copy")
                  api("DELETE", session + "/window")
                  switch(other)
                  assert writer_state() == "busy" and not canvas_ready(), "automatic takeover is forbidden"
                  retry_writer()
                  until(canvas_ready, "explicit takeover starts fresh engine")
                  assert writer_state() == "writer"
                  greet()
                  fifth = until(lambda: greeting_count(5), "new writer preserves latest progress")
                  assert fifth["revision"] == fourth["revision"] + 1
                  assert fifth["individual"] == fourth["individual"] and fifth["timer"] == fourth["timer"]
                  assert until(lambda: saved("delivery_probe.json.previous") == fourth, "new writer recovery copy")
                  print(json.dumps({"browser_writer_ownership": "pass", "source_commit": manifest["source_commit"],
                      "observations": ["second tab denied engine mount", "live-owner takeover refused",
                                       "old owner persisted progress", "explicit takeover after close",
                                       "new writer loads latest revision"], "actual_site_verified": False}), flush=True)
                  # Exercise the normal greeting control using browser-generated touch
                  # events, not JavaScript click(), direct game calls or mouse actions.
                  def cdp(cmd, params):
                      return api("POST", session + "/goog/cdp/execute", {"cmd": cmd, "params": params})
                  cdp("Emulation.setTouchEmulationEnabled", {"enabled": True, "maxTouchPoints": 1})
                  api("POST", session + "/refresh", {})
                  b = until(canvas_ready, "touch-enabled loader")
                  assert saved() == fifth, "Touch-mode reload changed profile"
                  assert script("return navigator.maxTouchPoints") >= 1
                  script("""
                    window.arch002TouchEvents = [];
                    for (const type of ['touchstart', 'touchend', 'touchcancel']) {
                      document.addEventListener(type, e => window.arch002TouchEvents.push({
                        type: e.type, trusted: e.isTrusted,
                        canvas: e.target instanceof HTMLCanvasElement
                      }), {capture: true, passive: true});
                    }
                  """)
                  point = {"x": round(b["x"] + b["width"] * 0.5),
                           "y": round(b["y"] + b["height"] * (335 / 820)), "id": 0}
                  cdp("Input.dispatchTouchEvent", {"type": "touchStart", "touchPoints": [point]})
                  time.sleep(0.1)
                  cdp("Input.dispatchTouchEvent", {"type": "touchEnd", "touchPoints": []})
                  events = script("return window.arch002TouchEvents")
                  assert [e["type"] for e in events] == ["touchstart", "touchend"], events
                  assert all(e["trusted"] and e["canvas"] for e in events), events
                  touched = until(lambda: greeting_count(6), "touch greeting persisted")
                  assert touched["revision"] == fifth["revision"] + 1
                  assert touched["individual"] == fifth["individual"] and touched["timer"] == fifth["timer"]
                  assert until(lambda: saved("delivery_probe.json.previous") == fifth, "touch recovery copy")
                  time.sleep(2)
                  assert saved() == touched, "One touch caused duplicate or delayed mutation"
                  screenshot("09-touch-greeting")
                  api("POST", session + "/refresh", {})
                  until(canvas_ready, "reload after touch greeting")
                  assert saved() == touched and saved("delivery_probe.json.previous") == fifth
                  print(json.dumps({"browser_emulated_touch": "pass", "source_commit": manifest["source_commit"],
                      "events": events, "physical_device_verified": False,
                      "actual_site_verified": False, "audio_verified": False}), flush=True)
                  # Observe the actual Web Audio graph on a new document. The
                  # CI-only analyser taps destination-bound nodes in parallel:
                  # it does not resume a context, trigger playback or route
                  # any extra signal to the speakers. Keep autoplay defaults.
                  cdp("Emulation.setTouchEmulationEnabled", {"enabled": False})
                  cdp("Page.addScriptToEvaluateOnNewDocument", {"source": """
                    (() => {
                      const observed = window.arch002Audio = {
                        taps: 0, running: 0, peak: 0, trustedCanvasDown: 0, errors: []
                      };
                      const taps = [];
                      const seen = new WeakMap();
                      const connect = AudioNode.prototype.connect;
                      AudioNode.prototype.connect = function(destination, ...args) {
                        const result = Reflect.apply(connect, this, [destination, ...args]);
                        if (destination === this.context.destination) {
                          try {
                            const output = args[0] ?? 0;
                            if (!seen.has(this)) seen.set(this, new Set());
                            if (!seen.get(this).has(output)) {
                              const analyser = this.context.createAnalyser();
                              analyser.fftSize = 512;
                              Reflect.apply(connect, this, [analyser, output, 0]);
                              seen.get(this).add(output);
                              taps.push({analyser, samples: new Float32Array(analyser.fftSize)});
                              observed.taps = taps.length;
                            }
                          } catch (error) { observed.errors.push(String(error)); }
                        }
                        return result;
                      };
                      document.addEventListener('pointerdown', event => {
                        if (event.isTrusted && event.target instanceof HTMLCanvasElement)
                          observed.trustedCanvasDown++;
                      }, true);
                      setInterval(() => {
                        observed.running = 0;
                        for (const {analyser, samples} of taps) {
                          if (analyser.context.state !== 'running') continue;
                          observed.running++;
                          analyser.getFloatTimeDomainData(samples);
                          for (const value of samples)
                            observed.peak = Math.max(observed.peak, Math.abs(value));
                        }
                      }, 10);
                    })();
                  """})
                  api("POST", session + "/refresh", {})
                  until(canvas_ready, "audio-observed fresh loader")
                  assert saved() == touched, "Audio-test reload changed profile"
                  def audio_observation():
                      return script("return window.arch002Audio")
                  until(lambda: audio_observation()["taps"] > 0, "destination audio graph")
                  time.sleep(1)
                  silent = audio_observation()
                  assert not silent["errors"] and silent["trustedCanvasDown"] == 0, silent
                  assert silent["peak"] < 0.0001, ("Unexpected pre-gesture signal", silent)
                  greet()
                  seventh = until(lambda: greeting_count(7), "audio gesture greeting persisted")
                  assert seventh["revision"] == touched["revision"] + 1
                  assert seventh["individual"] == touched["individual"] and seventh["timer"] == touched["timer"]
                  def playing_signal():
                      observation = audio_observation()
                      assert not observation["errors"], observation
                      return observation if (observation["running"] > 0 and
                          observation["trustedCanvasDown"] == 1 and observation["peak"] > 0.001) else None
                  played = until(playing_signal, "non-silent running Web Audio signal after gesture", 10)
                  assert until(lambda: saved("delivery_probe.json.previous") == touched,
                               "audio greeting recovery copy")
                  screenshot("10-audio-gesture")
                  audio_report = {"browser_gesture_audio_graph": "pass",
                      "source_commit": manifest["source_commit"],
                      "before_gesture": silent, "after_gesture": played,
                      "observations": ["no pre-gesture signal", "trusted canvas pointer",
                          "running Web Audio context", "non-silent destination-bound signal"],
                      "physical_audio_output_verified": False, "actual_site_verified": False}
                  (evidence / "audio-observation.json").write_text(json.dumps(audio_report, indent=2))
                  print(json.dumps(audio_report), flush=True)
                  # Force an actual IndexedDB write transaction to abort,
                  # after a real put succeeds but before commit. Keep the fault
                  # armed for this document so retries cannot silently persist
                  # its volatile snapshot. No application failure flag is set.
                  assert saved() == seventh
                  script("""
                    window.arch002StorageFault = {aborts: 0, errors: []};
                    const armed = new WeakSet();
                    const put = IDBObjectStore.prototype.put;
                    IDBObjectStore.prototype.put = function(...args) {
                      const request = Reflect.apply(put, this, args);
                      const tx = this.transaction;
                      if (this.name === 'FILE_DATA' && tx.mode === 'readwrite' &&
                          !armed.has(tx)) {
                        armed.add(tx);
                        tx.addEventListener('abort', () => window.arch002StorageFault.aborts++,
                                            {once: true});
                        request.addEventListener('success', () => {
                          try { tx.abort(); }
                          catch (error) { window.arch002StorageFault.errors.push(String(error)); }
                        }, {once: true});
                      }
                      return request;
                    };
                  """)
                  greet()
                  def storage_failure():
                      result = script("""
                        const warning = document.getElementById('storage-warning');
                        return {fault: window.arch002StorageFault,
                                writer: window.littleRayProbeWriter,
                                state: document.body.dataset.storageState,
                                visible: !warning.hidden && warning.getBoundingClientRect().height > 0,
                                message: warning.textContent};
                      """)
                      assert not result["fault"]["errors"], result
                      return result if result["fault"]["aborts"] > 0 else None
                  fault = until(storage_failure, "actual IndexedDB transaction abort", 20)
                  assert fault["state"] == "failed" and fault["writer"] is False, fault
                  assert fault["visible"] and "Save unavailable" in fault["message"], fault
                  assert script("return document.getElementById('save-confirmation').hidden"), "Failed write left a positive save badge visible"
                  assert saved() == seventh, "Aborted browser transaction changed active save"
                  assert saved("delivery_probe.json.previous") == touched, "Aborted browser transaction changed recovery copy"
                  greet()  # Later actions must not persist while the document is faulted.
                  time.sleep(2)
                  assert saved() == seventh and saved("delivery_probe.json.previous") == touched
                  screenshot("11-indexeddb-abort")
                  api("POST", session + "/refresh", {})
                  until(canvas_ready, "reload after real storage transaction abort")
                  assert saved() == seventh and saved("delivery_probe.json.previous") == touched
                  assert script("return window.littleRayProbeWriter === true && document.getElementById('storage-warning').hidden")
                  greet()
                  eighth = until(lambda: greeting_count(8), "single greeting after fresh reload", 20)
                  assert eighth["revision"] == seventh["revision"] + 1
                  assert eighth["individual"] == seventh["individual"] and eighth["timer"] == seventh["timer"]
                  assert until(lambda: saved("delivery_probe.json.previous") == seventh, "post-abort recovery copy")
                  screenshot("12-indexeddb-recovery")
                  storage_report = {"browser_indexeddb_abort": "pass",
                      "source_commit": manifest["source_commit"], "failure": fault,
                      "before": seventh, "after_reload_retry": eighth,
                      "fault_injection": "real transaction.abort after put success in disposable CI browser",
                      "physical_disk_failure_verified": False, "crash_durability_verified": False,
                      "actual_site_verified": False}
                  (evidence / "storage-observation.json").write_text(json.dumps(storage_report, indent=2))
                  print(json.dumps(storage_report), flush=True)
                  # Only kill this disposable CI browser, never an arbitrary system process.
                  # The previous reads came from independent IndexedDB read-only transactions.
                  assert eighth == saved() and saved("delivery_probe.json.previous") == seventh
                  profile_arg = os.fsencode("--user-data-dir=" + profile)
                  browser_pids = []
                  for entry in pathlib.Path("/proc").iterdir():
                      if not entry.name.isdigit():
                          continue
                      try:
                          argv = (entry / "cmdline").read_bytes().split(b"\0")
                          exe = (entry / "exe").resolve(strict=True).name
                      except (OSError, RuntimeError):
                          continue
                      if (exe == "chrome" and profile_arg in argv and
                              not any(arg.startswith(b"--type=") for arg in argv)):
                          browser_pids.append(int(entry.name))
                  assert len(browser_pids) == 1, f"Expected one disposable Chrome browser: {browser_pids}"
                  browser_pid = browser_pids[0]
                  # Recheck the exact process identity immediately before termination.
                  assert profile_arg in pathlib.Path(f"/proc/{browser_pid}/cmdline").read_bytes().split(b"\0")
                  os.kill(browser_pid, signal.SIGKILL)

                  def browser_exited():
                      try:
                          return pathlib.Path(f"/proc/{browser_pid}/stat").read_text().rsplit(")", 1)[1].split()[0] == "Z"
                      except FileNotFoundError:
                          return True

                  until(browser_exited, "abrupt Chrome browser exit", 15)
                  try:
                      api("DELETE", session)
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                  session = None
                  until(driver_ready, "ChromeDriver after abrupt browser exit", 15)
                  reopened = api("POST", "/session", {"capabilities": {"alwaysMatch": {
                      "browserName": "chrome", "goog:chromeOptions": {"args": [
                          "--headless=new", "--window-size=900,1000",
                          "--disable-dev-shm-usage", "--user-data-dir=" + profile]}}}})
                  session = "/session/" + reopened["sessionId"]
                  api("POST", session + "/timeouts", {"script": 10000, "pageLoad": 30000})
                  cdp("Emulation.setDeviceMetricsOverride", {"width": 720, "height": 820,
                      "deviceScaleFactor": 1, "mobile": False})
                  api("POST", session + "/url", {"url": url})
                  until(canvas_ready, "fresh Chrome process after abrupt termination")
                  assert script("return window.littleRayProbeWriter === true")
                  assert saved() == eighth, "Last committed active profile lost after abrupt browser exit"
                  assert saved("delivery_probe.json.previous") == seventh, "Recovery copy lost after abrupt browser exit"
                  screenshot("13-browser-crash-reopen")
                  greet()
                  ninth = until(lambda: greeting_count(9), "single action after browser crash recovery", 20)
                  assert ninth["revision"] == eighth["revision"] + 1
                  assert ninth["individual"] == eighth["individual"] and ninth["timer"] == eighth["timer"]
                  assert until(lambda: saved("delivery_probe.json.previous") == eighth, "post-crash previous-good copy")
                  screenshot("14-browser-crash-retry")
                  crash_report = {"browser_process_crash_recovery": "pass",
                      "source_commit": manifest["source_commit"], "method": "SIGKILL after committed IndexedDB readback",
                      "before": eighth, "after_restart_action": ninth,
                      "browser": reopened["capabilities"].get("browserVersion"),
                      "mid_transaction_crash_verified": False, "physical_power_loss_verified": False,
                      "actual_site_verified": False}
                  (evidence / "crash-observation.json").write_text(json.dumps(crash_report, indent=2))
                  print(json.dumps(crash_report), flush=True)
                  # Exercise a real synchronous transaction() refusal, without
                  # closing the engine's own connection or corrupting its data.
                  refusal = api("POST", session + "/execute/async", {"args": [], "script": """
                    const done = arguments[arguments.length - 1];
                    (async () => {
                      // Locate the mounted database using the persisted active file.
                      // FILE_DATA is the object store, not necessarily the database name.
                      const matches = [];
                      for (const info of await indexedDB.databases()) {
                        if (!info.name) continue;
                        const candidate = await new Promise((resolve, reject) => {
                          const r = indexedDB.open(info.name);
                          r.onsuccess = () => resolve(r.result);
                          r.onerror = () => reject(r.error);
                        });
                        try {
                          if (!candidate.objectStoreNames.contains('FILE_DATA')) continue;
                          const keys = await new Promise((resolve, reject) => {
                            const r = candidate.transaction('FILE_DATA', 'readonly')
                                               .objectStore('FILE_DATA').getAllKeys();
                            r.onsuccess = () => resolve(r.result);
                            r.onerror = () => reject(r.error);
                          });
                          if (keys.some(key => String(key).endsWith('/delivery_probe.json')))
                            matches.push(candidate);
                        } finally { candidate.close(); }
                      }
                      if (matches.length !== 1)
                        throw new Error('Expected exactly one existing probe IDBFS database');
                      const db = matches[0];
                      const attempt = mode => {
                        try { db.transaction('FILE_DATA', mode); return 'unexpected success'; }
                        catch (e) { return e.name; }
                      };
                      const readonly = attempt('readonly');
                      const writerAfterReadonly = window.littleRayProbeWriter;
                      const write = attempt('readwrite');
                      const warning = document.getElementById('storage-warning');
                      return {database: db.name, readonly, writerAfterReadonly, write,
                              writer: window.littleRayProbeWriter,
                              state: document.body.dataset.storageState,
                              visible: !warning.hidden && warning.getBoundingClientRect().height > 0,
                              message: warning.textContent};
                    })().then(done, e => done({browser_error: String(e)}));
                  """})
                  assert refusal.get("readonly") == "InvalidStateError", refusal
                  assert refusal["writerAfterReadonly"] is True, refusal
                  assert refusal["write"] == "InvalidStateError", refusal
                  assert refusal["writer"] is False and refusal["state"] == "failed", refusal
                  assert refusal["visible"] and "Displayed progress may include unsaved changes" in refusal["message"], refusal
                  greet()
                  time.sleep(2)
                  assert saved() == ninth and saved("delivery_probe.json.previous") == eighth
                  screenshot("15-indexeddb-sync-refusal")
                  api("POST", session + "/refresh", {})
                  until(canvas_ready, "reload after synchronous storage refusal")
                  assert saved() == ninth and saved("delivery_probe.json.previous") == eighth
                  assert script("return window.littleRayProbeWriter === true && document.getElementById('storage-warning').hidden")
                  refusal_report = {"browser_sync_storage_refusal": "pass",
                      "source_commit": manifest["source_commit"], "observation": refusal,
                      "before_and_after": ninth, "previous_good": eighth,
                      "method": "real closed independent IDBFS database connection; not engine connection",
                      "actual_site_verified": False}
                  (evidence / "storage-refusal-observation.json").write_text(json.dumps(refusal_report, indent=2))
                  print(json.dumps(refusal_report), flush=True)
                  print(json.dumps({"browser_smoke": "pass", "source_commit": manifest["source_commit"],
                      "browser": opened["capabilities"].get("browserVersion"),
                      "observations": ["loader completion", "mouse greeting", "IndexedDB persistence",
                                       "reload and second greeting"],
                      "actual_site_verified": False, "audio_verified": False}), flush=True)
                  # Independent production-profile transport on real browser IndexedDB.
                  # Separate database; the diagnostic scene and its save stay untouched.
                  transport_source = pathlib.Path("spikes/web_delivery/profile_transport.js").read_text()
                  transport_fixture = pathlib.Path("tests/arch002_profile_transport_browser.js").read_text()
                  transport_result = api("POST", session + "/execute/async", {
                      "args": [transport_source], "script": transport_fixture})
                  (evidence / "profile-transport-observation.json").write_text(json.dumps(transport_result, indent=2))
                  print(json.dumps(transport_result), flush=True)
                  assert transport_result.get("profile_transport") == "pass", transport_result
                  assert len(transport_result.get("checks", [])) == 72, transport_result
                  api("DELETE", session)
                  session = None
          finally:
              if session:
                  try:
                      api("DELETE", session)
                  except Exception as error:
                      print("Browser cleanup:", error, flush=True)
              driver.terminate()
              try:
                  driver.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  driver.kill()
                  driver.wait()
              server.shutdown()
          PY
      - name: Retain browser backup evidence (including failure checkpoints)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arch002-browser-evidence-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/arch002-browser-evidence/
          if-no-files-found: warn
          retention-days: 3

      # Read-only pinned input from the independent gameplay task. The
      # integration project lives outside both source checkouts.
      - name: Checkout exact city validation seam (independent input)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: be6bdbd308137b0227f25d1fa92dbec45dd1e90d
          path: .arch002-city-source
          persist-credentials: false
      - name: Native city and staged-profile roundtrip (not hosted)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          test "$(git -C .arch002-city-source rev-parse HEAD)" = "be6bdbd308137b0227f25d1fa92dbec45dd1e90d"
          project="$RUNNER_TEMP/arch002-city-integration"
          mkdir -p "$project"
          cp -a .arch002-city-source/game/city_checkpoint/. "$project/"
          cp spikes/web_delivery/profile_commit.gd "$project/"
          cp tests/arch002_city_bridge.gd "$project/"
          cp integration/arch002/city_profile_session.gd "$project/"
          cp tests/arch002_city_session_test.gd "$project/"
          export XDG_DATA_HOME="$RUNNER_TEMP/arch002-city-userdata"
          editor="$RUNNER_TEMP/arch002-engine/Godot_v4.7.2-stable_linux.x86_64"
          printf 'Architect source %s; city source %s\n' "$(git rev-parse HEAD)" "$(git -C .arch002-city-source rev-parse HEAD)"
          timeout 90s "$editor" --headless --path "$project" --script res://arch002_city_bridge.gd
          timeout 90s "$editor" --headless --path "$project" --script res://arch002_city_session_test.gd

      - name: Export combined acknowledged city (isolated candidate)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/arch002-city-integration"
          export XDG_DATA_HOME="$RUNNER_TEMP/arch002-city-userdata"
          editor="$RUNNER_TEMP/arch002-engine/Godot_v4.7.2-stable_linux.x86_64"
          mkdir -p "$XDG_DATA_HOME/godot/export_templates/4.7.2.stable"
          cp "$RUNNER_TEMP/arch002-templates/"* "$XDG_DATA_HOME/godot/export_templates/4.7.2.stable/"
          # Only the disposable integration copy changes; gameplay owns its source.
          cat > "$project/arch002_city_entry.gd" <<'GD'
          extends Node

          const Session = preload("res://city_profile_session.gd")
          const CityScene = preload("res://main.tscn")

          var city: Variant
          var session: Variant
          var diagnostic_window: Variant
          var presses: Dictionary = {"plant": 0, "feed": 0, "collect": 0, "harvest": 0, "backup": 0}
          var downs: Dictionary = {"plant": 0, "feed": 0, "collect": 0, "harvest": 0, "backup": 0}
          var backup_button: Button
          var backup_panel: ColorRect
          var backup_text: TextEdit
          var backup_help: Label
          var backup_message: Label
          var backup_export: Button
          var backup_preview: Button
          var backup_restore: Button
          var backup_close: Button
          var backup_confirmation: String = ""
          var restore_pending: bool = false

          func _ready() -> void:
              session = Session.new()
              session.start_web()
              city = CityScene.instantiate()
              if not city.configure_profile_session(session):
                  push_error("City persistence injection refused; no session-only fallback.")
                  return
              add_child(city)
              setup_backup_ui()
              # Read-only CI diagnostics, opt-in on the isolated export.
              # No command injection, clock acceleration or persistence override.
              if OS.has_feature("web") and JavaScriptBridge.eval("new URLSearchParams(location.search).get('arch002_test') === '1'"):
                  diagnostic_window = JavaScriptBridge.get_interface("window")
                  city.plant_short.button_down.connect(mark_down.bind("plant"))
                  city.feed_button.button_down.connect(mark_down.bind("feed"))
                  city.collect_button.button_down.connect(mark_down.bind("collect"))
                  city.harvest_button.button_down.connect(mark_down.bind("harvest"))
                  city.plant_short.pressed.connect(mark_pressed.bind("plant"))
                  city.feed_button.pressed.connect(mark_pressed.bind("feed"))
                  city.collect_button.pressed.connect(mark_pressed.bind("collect"))
                  city.harvest_button.pressed.connect(mark_pressed.bind("harvest"))
                  backup_button.button_down.connect(mark_down.bind("backup"))
                  backup_button.pressed.connect(mark_pressed.bind("backup"))

          # Isolated integration controls; gameplay's pinned source is untouched.
          # The full-screen modal suspends normal command processing while a preview
          # is outstanding. It never permits a restore before exact acknowledgement.
          func setup_backup_ui() -> void:
              backup_button = Button.new()
              backup_button.text = "City backup / restore"
              backup_button.position = Vector2(800, 607)
              backup_button.size = Vector2(268, 44)
              backup_button.disabled = true
              backup_button.pressed.connect(open_backup)
              city.add_child(backup_button)

              var layer := CanvasLayer.new()
              add_child(layer)
              backup_panel = ColorRect.new()
              backup_panel.color = Color("#183d4b")
              backup_panel.mouse_filter = Control.MOUSE_FILTER_STOP
              layer.add_child(backup_panel)
              backup_panel.set_anchors_and_offsets_preset(Control.PRESET_FULL_RECT)
              var heading := Label.new()
              heading.text = "CITY BACKUP  /  Restore saved progress"
              heading.position = Vector2(100, 95)
              heading.add_theme_font_size_override("font_size", 30)
              backup_panel.add_child(heading)
              backup_help = Label.new()
              backup_help.text = "Export JSON and copy it somewhere safe. Paste a backup and preview it.\nReplacement keeps your last confirmed city as a recovery copy."
              backup_help.autowrap_mode = TextServer.AUTOWRAP_WORD_SMART
              backup_help.add_theme_font_size_override("font_size", 18)
              backup_panel.add_child(backup_help)
              backup_help.position = Vector2(100, 145)
              backup_help.size = Vector2(900, 62)
              backup_text = TextEdit.new()
              backup_text.position = Vector2(100, 215)
              backup_text.size = Vector2(900, 355)
              backup_text.wrap_mode = TextEdit.LINE_WRAPPING_BOUNDARY
              backup_text.placeholder_text = "Exported or pasted portable city JSON"
              backup_text.text_changed.connect(backup_input_changed)
              backup_panel.add_child(backup_text)
              backup_message = Label.new()
              backup_message.autowrap_mode = TextServer.AUTOWRAP_WORD_SMART
              backup_message.add_theme_font_size_override("font_size", 18)
              backup_panel.add_child(backup_message)
              backup_message.position = Vector2(100, 585)
              backup_message.size = Vector2(900, 80)
              backup_export = backup_control("Export to text", 100, export_backup_text)
              backup_preview = backup_control("Preview import", 330, preview_backup_text)
              backup_restore = backup_control("Confirm replacement", 560, restore_backup_text)
              backup_close = backup_control("Back to city", 790, close_backup)
              backup_restore.disabled = true
              backup_panel.hide()

          func backup_control(label: String, x: int, action: Callable) -> Button:
              var button := Button.new()
              button.text = label
              button.position = Vector2(x, 680)
              button.size = Vector2(210, 52)
              button.add_theme_font_size_override("font_size", 17)
              button.pressed.connect(action)
              backup_panel.add_child(button)
              return button

          func open_backup() -> void:
              if session.status() != "ready" or not city.profile_confirmed or city.profile_view_invalid:
                  return
              var focus := get_viewport().gui_get_focus_owner()
              if focus != null:
                  focus.release_focus()
              city.process_mode = Node.PROCESS_MODE_DISABLED
              backup_panel.show()
              backup_text.editable = true
              backup_export.disabled = false
              backup_preview.disabled = false
              backup_close.disabled = false
              invalidate_backup_preview()
              backup_text.grab_focus()

          func backup_input_changed() -> void:
              # A programmatic export may emit a deferred text_changed signal.
              # Only invalidate a live preview; do not overwrite export feedback.
              if not backup_confirmation.is_empty():
                  invalidate_backup_preview()

          func invalidate_backup_preview() -> void:
              backup_confirmation = ""
              backup_restore.disabled = true
              if not restore_pending:
                  backup_message.text = "Preview is required before replacement."

          func export_backup_text() -> void:
              var encoded: String = session.export_backup()
              invalidate_backup_preview()
              if encoded.is_empty():
                  backup_message.text = "No confirmed backup available."
                  return
              backup_text.text = encoded
              backup_message.text = "Confirmed backup exported to text. Select and copy it somewhere safe."

          func preview_backup_text() -> void:
              invalidate_backup_preview()
              var result: Dictionary = session.preview_backup(backup_text.text)
              if not result.get("ok", false):
                  backup_message.text = str(result.get("reason", "Invalid backup."))
                  return
              backup_confirmation = str(result.get("confirmation", ""))
              backup_restore.disabled = backup_confirmation.is_empty()
              backup_message.text = "Replace current city with: %d Gold, %d Food, %d XP, %d rays (revision %d)? This replaces progress; the previous save is retained." % [result.gold, result.food, result.xp, result.individual_count, result.domain_revision]

          func restore_backup_text() -> void:
              if restore_pending or backup_confirmation.is_empty():
                  return
              var token: String = backup_confirmation
              invalidate_backup_preview()
              var now := Time.get_ticks_msec()
              if not session.stage_restore(backup_text.text, token, int(Time.get_unix_time_from_system() * 1000.0)):
                  city.update_profile_display()
                  backup_message.text = "Replacement not queued. Preview again or reload if storage is unavailable."
                  if session.status() != "ready":
                      backup_export.disabled = true
                      backup_preview.disabled = true
                  return
              # Explicit replacement starts a new local elapsed sample. On cancel,
              # the old sample is unchanged, so the next tick settles time spent here.
              city.last_ms = now
              city.profile_pending_kind = "backup_restore"
              city.update_profile_display()
              restore_pending = true
              backup_text.editable = false
              backup_export.disabled = true
              backup_preview.disabled = true
              backup_close.disabled = true
              backup_message.text = "Saving replacement… wait for confirmed storage."

          func close_backup() -> void:
              if restore_pending:
                  return
              backup_text.release_focus()
              backup_panel.hide()
              backup_confirmation = ""
              city.process_mode = Node.PROCESS_MODE_INHERIT

          func process_backup() -> void:
              backup_button.disabled = session.status() != "ready" or not city.profile_confirmed or city.profile_view_invalid
              if not restore_pending:
                  return
              # Use the existing city acknowledgement path while ordinary city input
              # and auto-checkpointing are suspended. Do not publish speculative state.
              city.process_profile(Time.get_ticks_msec(), int(Time.get_unix_time_from_system() * 1000.0))
              if session.status() == "saving":
                  return
              restore_pending = false
              backup_close.disabled = false
              if session.status() == "ready" and not city.profile_view_invalid:
                  city.cancel_map_preview()
                  city.name_edit.text = str(city.city.individuals[city.selected_ray]["nickname"])
                  city.status_label.text = "Backup restored."
                  backup_message.text = "Backup restored."
                  backup_text.editable = true
                  backup_export.disabled = false
                  backup_preview.disabled = false
              else:
                  backup_message.text = "Save unavailable. Close and reload to reconcile; replacement outcome is not confirmed."

          func mark_down(kind: String) -> void:
              downs[kind] += 1

          func mark_pressed(kind: String) -> void:
              presses[kind] += 1

          func _process(_delta: float) -> void:
              if backup_panel != null:
                  process_backup()
              if diagnostic_window == null:
                  return
              diagnostic_window.arch002CityState = JSON.stringify({
                  "phase": session.status(), "confirmed": city.profile_confirmed,
                  "invalid": city.profile_view_invalid, "overlay": city.profile_overlay.visible,
                  "tick_age_ms": Time.get_ticks_msec() - city.last_ms,
                  "ready_age_ms": Time.get_ticks_msec() - city.profile_ready_since_ms,
                  "domain_revision": city.city.revision, "pending_kind": city.profile_pending_kind,
                  "status": city.status_label.text, "footer": city.profile_footer.text,
                  "backup_open": backup_panel.visible, "backup_message": backup_message.text,
                  "backup_restore_disabled": backup_restore.disabled,
                  "backup_help_bounds_ok": backup_panel.get_global_rect().encloses(backup_help.get_global_rect()) and backup_help.get_global_rect().end.y <= backup_text.get_global_rect().position.y,
                  "backup_message_bounds_ok": backup_panel.get_global_rect().encloses(backup_message.get_global_rect()) and backup_message.get_global_rect().end.y <= backup_restore.get_global_rect().position.y,
                  "downs": downs, "presses": presses,
                  "disabled": {"plant": city.plant_short.disabled, "feed": city.feed_button.disabled, "collect": city.collect_button.disabled, "harvest": city.harvest_button.disabled, "backup": backup_button.disabled},
                  "rects": {"plant": str(city.plant_short.get_global_rect()), "feed": str(city.feed_button.get_global_rect()), "collect": str(city.collect_button.get_global_rect()), "harvest": str(city.harvest_button.get_global_rect())},
                  "viewport": str(city.get_viewport_rect().size)})
          GD
          cat > "$project/arch002_city_entry.tscn" <<'SCENE'
          [gd_scene load_steps=2 format=3]

          [ext_resource type="Script" path="res://arch002_city_entry.gd" id="1"]

          [node name="PersistentCity" type="Node"]
          script = ExtResource("1")
          SCENE
          sed -i 's|run/main_scene="res://main.tscn"|run/main_scene="res://arch002_city_entry.tscn"|' "$project/project.godot"
          grep -Fx 'run/main_scene="res://arch002_city_entry.tscn"' "$project/project.godot"
          out="$RUNNER_TEMP/arch002-persistent-city"
          mkdir -p "$out"
          timeout 90s "$editor" --headless --path "$project" --editor --import
          timeout 90s "$editor" --headless --path "$project" --export-release Web "$out/index.html"
          # Classic external script executes synchronously before the generated
          # engine loader; reuse the exact transport implementation, not a fork.
          python3 - "$out" <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys
          out = pathlib.Path(sys.argv[1])
          transport = pathlib.Path("spikes/web_delivery/profile_transport.js").read_text()
          classic, count = re.subn(r"(?m)^export (?=(?:async )?function )", "", transport)
          assert count == 3 and not re.search(r"(?m)^\s*(?:import|export)\s", classic)
          (out / "profile-boot.js").write_text(
              '"use strict";\n' + classic +
              '\nwindow.littleRayCityProfilePort = createGodotProfilePort(() => openProfileSession("little-ray-city-checkpoint-v2"));\n')
          index = out / "index.html"
          html = index.read_text()
          assert html.count("</head>") == 1 and "profile-boot.js" not in html
          index.write_text(html.replace("</head>", '<script src="profile-boot.js"></script>\n</head>', 1))
          files = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}
          assert "index.wasm" in files and "index.pck" in files
          (out / "integration-manifest.json").write_text(json.dumps({
              "architect_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "city_commit": subprocess.check_output(["git", "-C", ".arch002-city-source", "rev-parse", "HEAD"], text=True).strip(),
              "sha256": files, "actual_site_verified": False}, indent=2))
          PY
      - name: Exercise real city controls and reload in Chromium
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, functools, http.server, json, os, pathlib, subprocess
          import tempfile, threading, time, urllib.request

          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "arch002-persistent-city"
          server = http.server.ThreadingHTTPServer(("127.0.0.1", 0),
              functools.partial(http.server.SimpleHTTPRequestHandler, directory=str(root)))
          threading.Thread(target=server.serve_forever, daemon=True).start()
          url = f"http://127.0.0.1:{server.server_port}/index.html?arch002_test=1"
          driver = subprocess.Popen(["chromedriver", "--port=9516"])
          session = None
          evidence = root.parent / "arch002-city-browser-evidence"
          evidence.mkdir(exist_ok=True)
          def api(method, path, data=None):
              req = urllib.request.Request("http://127.0.0.1:9516" + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={"Content-Type": "application/json"}, method=method)
              with urllib.request.urlopen(req, timeout=35) as response:
                  return json.load(response)["value"]
          def wait(fn, label, seconds=35):
              end = time.monotonic() + seconds
              while time.monotonic() < end:
                  result = fn()
                  if result:
                      return result
                  time.sleep(.15)
              raise AssertionError("Timed out: " + label)
          def driver_ready():
              try:
                  return api("GET", "/status").get("ready")
              except OSError:
                  return False
          def js(source):
              return api("POST", session + "/execute/sync", {"script": source, "args": []})
          def saved():
              result = api("POST", session + "/execute/async", {"args": [], "script": """
                const done = arguments[arguments.length - 1];
                (async () => {
                  const name = "little-ray-city-checkpoint-v2";
                  if (!(await indexedDB.databases()).some(x => x.name === name)) return null;
                  const db = await new Promise((ok, bad) => {
                    const r = indexedDB.open(name); r.onsuccess = () => ok(r.result);
                    r.onerror = () => bad(r.error); r.onupgradeneeded = () => r.transaction.abort();
                  });
                  try {
                    return await new Promise((ok, bad) => {
                      const t = db.transaction("profiles", "readonly");
                      const a = t.objectStore("profiles").get("active");
                      const p = t.objectStore("profiles").get("previous");
                      t.oncomplete = () => ok(a.result === undefined ? null :
                        {active: JSON.parse(a.result), previous: p.result === undefined ? null : JSON.parse(p.result)});
                      t.onabort = () => bad(t.error); t.onerror = () => bad(t.error);
                    });
                  } finally { db.close(); }
                })().then(done, e => done({error: String(e)}));
              """})
              if result and "error" in result:
                  raise AssertionError(result)
              return result
          def bounds():
              return js("const c=document.querySelector('canvas'); return c && c.width && !document.getElementById('status') ? c.getBoundingClientRect().toJSON() : null;")
          trace = []
          def view():
              return js("return window.arch002CityState ? JSON.parse(window.arch002CityState) : null;")
          def ready(kind):
              state = view()
              return state if state and state["phase"] == "ready" and state["confirmed"] and not state["invalid"] and not state["overlay"] and not state["disabled"][kind] and 0 <= state["ready_age_ms"] < 300 else None
          def record(label):
              item = {"label": label, "view": view(), "canvas": bounds(), "saved": saved()}
              trace.append(item)
              (evidence / "input-trace.json").write_text(json.dumps(trace, indent=2))
              print(json.dumps({"input_trace": label, "view": item["view"], "canvas": item["canvas"]}), flush=True)
          def click(kind, x, y):
              b = wait(bounds, "city canvas")
              def pointer(actions):
                  api("POST", session + "/actions", {"actions": [{"type":"pointer","id":"mouse",
                      "parameters":{"pointerType":"mouse"},"actions":actions}]})
              pointer([{"type":"pointerMove","duration":50,"origin":"viewport",
                        "x":round(b["x"]+b["width"]*x/1100),"y":round(b["y"]+b["height"]*y/880)}])
              record(kind + "-before")
              capture(kind + "-before")
              before = wait(lambda: ready(kind), "confirmed enabled UI: " + kind, 15)
              # Allow several Godot frames between mouse-down and mouse-up.
              # Only one click per economic action, never retry an uncertain effect.
              pointer([{"type":"pointerDown","button":0},{"type":"pause","duration":80},{"type":"pointerUp","button":0}])
              capture(kind + "-after-click")
              record(kind + "-after-click")
              wait(lambda: (v if (v := view()) and v["presses"][kind] == before["presses"][kind] + 1 else None),
                   "Godot pressed signal: " + kind, 5)
          def modal_click(x, y):
              b = wait(bounds, "backup canvas")
              api("POST", session + "/actions", {"actions": [{"type":"pointer","id":"mouse",
                  "parameters":{"pointerType":"mouse"},"actions":[
                      {"type":"pointerMove","duration":50,"origin":"viewport",
                       "x":round(b["x"]+b["width"]*x/1100),"y":round(b["y"]+b["height"]*y/880)},
                      {"type":"pointerDown","button":0},{"type":"pause","duration":80},
                      {"type":"pointerUp","button":0}]}]})
          def observe(predicate, label, seconds=35):
              def probe():
                  pair = saved()
                  return pair if pair and predicate(pair["active"]["model"]) else None
              return wait(probe, label, seconds)
          def capture(name):
              (evidence / (name + ".png")).write_bytes(base64.b64decode(api("GET", session + "/screenshot")))
          try:
              with tempfile.TemporaryDirectory(prefix="arch002-persistent-city-") as profile:
                  wait(driver_ready, "ChromeDriver ready", 15)
                  opened = api("POST", "/session", {"capabilities":{"alwaysMatch":{"browserName":"chrome",
                      "goog:chromeOptions":{"args":["--headless=new","--window-size=1200,1000",
                          "--disable-dev-shm-usage","--user-data-dir="+profile]}}}})
                  session = "/session/" + opened["sessionId"]
                  api("POST", session + "/timeouts", {"script":10000,"pageLoad":30000})
                  api("POST", session + "/goog/cdp/execute", {"cmd":"Emulation.setDeviceMetricsOverride",
                      "params":{"width":1100,"height":880,"deviceScaleFactor":1,"mobile":False}})
                  api("POST", session + "/url", {"url":url})
                  wait(bounds, "Godot city loader")
                  assert js("return typeof window.littleRayCityProfilePort?.begin_open === 'function'")
                  fresh = observe(lambda m: m["gold"] == 1200 and m["food"] == 240, "initial durable city")
                  capture("01-initial")
                  click("plant", 910, 480)
                  planted = observe(lambda m: m["gold"] == 1180 and m["farm_crops"].get("farm-1",{}).get("recipe") == "sprout", "ordinary paid plant")
                  click("feed", 830, 363)
                  fed = observe(lambda m: m["food"] == 235 and m["individuals"]["ray-1"]["pips"] == 1, "ordinary feed")
                  capture("02-fed-and-planted")
                  # Verify positive resident income using real elapsed time, not a grant.
                  observe(lambda m: m["income_ticks"] >= 240, "resident bin accrual", 45)
                  click("collect", 910, 315)
                  collected = observe(lambda m: m["gold"] > 1180, "ordinary Gold collection")
                  assert collected["active"]["model"]["food"] == 235
                  assert collected["previous"]["storage_revision"] + 1 == collected["active"]["storage_revision"]
                  capture("03-collected")
                  api("POST", session + "/refresh", {})
                  wait(bounds, "city reload")
                  restored = wait(lambda: (p if (p := saved()) and p["active"]["storage_revision"] > collected["active"]["storage_revision"] else None), "new startup checkpoint")
                  for key in ("gold", "food", "individuals", "receipts", "farm_crops"):
                      assert restored["active"]["model"][key] == collected["active"]["model"][key], key
                  click("feed", 830, 363)
                  after = observe(lambda m: m["food"] == 230 and m["individuals"]["ray-1"]["pips"] == 2, "ordinary feed after reload")
                  assert len(after["active"]["model"]["receipts"]) == len(collected["active"]["model"]["receipts"]) + 1
                  capture("04-reloaded-fed")
                  before_harvest = observe(lambda m: m["elapsed_ms"] >= m["farm_crops"]["farm-1"]["deadline_ms"], "real-time crop maturity", 75)
                  before_model = before_harvest["active"]["model"]
                  assert before_model["farm_crops"]["farm-1"] == planted["active"]["model"]["farm_crops"]["farm-1"]
                  assert before_model["food"] == 230
                  click("harvest", 910, 576)
                  harvested = observe(lambda m: m["food"] == 270 and "farm-1" not in m["farm_crops"], "ordinary paid crop harvest")
                  harvested_model = harvested["active"]["model"]
                  assert harvested_model["gold"] == before_model["gold"]
                  assert harvested_model["xp"] == before_model["xp"] + 5
                  assert len(harvested_model["receipts"]) == len(before_model["receipts"]) + 1
                  capture("05-harvested")
                  api("POST", session + "/refresh", {})
                  wait(bounds, "post-harvest city reload")
                  harvest_restored = wait(lambda: (v if (v := view()) and v["phase"] == "ready" and v["confirmed"] and not v["invalid"] else None), "post-harvest ready")
                  assert harvest_restored["disabled"]["harvest"]
                  final = saved()
                  for key in ("gold", "food", "xp", "individuals", "receipts", "farm_crops"):
                      assert final["active"]["model"][key] == harvested_model[key], key
                  capture("06-harvest-reloaded")
                  # Use the normal backup controls, never inject a profile or call a command.
                  click("backup", 930, 629)
                  wait(lambda: view()["backup_open"], "backup modal opened")
                  modal_click(200, 705)
                  wait(lambda: view()["backup_message"].startswith("Confirmed backup exported"), "portable backup exported")
                  exported = saved()["active"]
                  capture("07-city-backup-export")
                  modal_click(900, 705)
                  wait(lambda: not view()["backup_open"], "backup modal closed")
                  click("feed", 830, 363)
                  observe(lambda m: m["food"] < exported["model"]["food"], "feed after exported backup")
                  click("backup", 930, 629)
                  wait(lambda: view()["backup_open"], "backup modal reopened")
                  before_restore = saved()["active"]
                  modal_click(430, 705)
                  wait(lambda: not view()["backup_restore_disabled"] and view()["backup_message"].startswith("Replace current city"), "validated backup preview")
                  assert saved()["active"] == before_restore, "preview mutated durable city"
                  preview_layout = view()
                  assert preview_layout["backup_help_bounds_ok"], "backup help extends outside modal or overlaps input"
                  assert preview_layout["backup_message_bounds_ok"], "backup status extends outside modal or overlaps actions"
                  capture("08-city-backup-preview")
                  modal_click(660, 705)
                  wait(lambda: view()["backup_message"] == "Backup restored." and view()["phase"] == "ready", "confirmed replacement")
                  replacement = saved()
                  assert replacement["previous"] == before_restore
                  assert replacement["active"]["storage_revision"] == before_restore["storage_revision"] + 1
                  assert replacement["active"]["model"]["revision"] > max(before_restore["model"]["revision"], exported["model"]["revision"])
                  for key in ("gold", "food", "xp", "individuals", "receipts", "farm_crops", "elapsed_ms"):
                      assert replacement["active"]["model"][key] == exported["model"][key], key
                  capture("09-city-backup-confirmed")
                  modal_click(900, 705)
                  wait(lambda: not view()["backup_open"], "back to restored city")
                  api("POST", session + "/refresh", {})
                  wait(bounds, "city reload after backup")
                  wait(lambda: (v if (v := view()) and v["phase"] == "ready" and v["confirmed"] and not v["invalid"] else None), "restored city reload")
                  backup_reloaded = saved()
                  for key in ("gold", "food", "xp", "individuals", "receipts", "farm_crops"):
                      assert backup_reloaded["active"]["model"][key] == exported["model"][key], key
                  click("feed", 830, 363)
                  post_backup_feed = observe(lambda m: m["food"] < exported["model"]["food"], "ordinary command after restore")
                  assert len(post_backup_feed["active"]["model"]["receipts"]) == len(exported["model"]["receipts"]) + 1
                  capture("10-city-backup-reloaded-fed")
                  report = {"persistent_city":"pass","browser":opened["capabilities"].get("browserVersion"),
                      "manifest":json.loads((root/"integration-manifest.json").read_text()),
                      "checks":["initial checkpoint","paid plant","feed","resident collection","reload preserves state","feed after reload","paid crop matures and harvests once","harvest persists after reload","portable city export and preview","explicit restore with previous-good","reload and command after restore"],
                      "fresh":fresh,"planted":planted,"fed":fed,"collected":collected,"restored":restored,"after":after,
                      "before_harvest":before_harvest,"harvested":harvested,"harvest_reloaded":final,
                      "backup_exported":exported,"backup_before_restore":before_restore,"backup_replacement":replacement,
                      "backup_reloaded":backup_reloaded,"post_backup_feed":post_backup_feed,
                      "backup_preview_layout":{"help_bounds_ok":preview_layout["backup_help_bounds_ok"],"message_bounds_ok":preview_layout["backup_message_bounds_ok"]},
                      "actual_site_verified":False}
                  (evidence/"observation.json").write_text(json.dumps(report, indent=2))
                  print(json.dumps({"persistent_city":"pass","checks":report["checks"],"actual_site_verified":False}), flush=True)
          except Exception as error:
              if session:
                  try:
                      capture("99-failure")
                      record("failure: " + str(error))
                  except Exception as diagnostic_error:
                      print("Failure evidence capture:", diagnostic_error, flush=True)
              raise
          finally:
              if session:
                  try:
                      api("DELETE", session)
                  except Exception as error:
                      print("Browser cleanup:", error, flush=True)
              driver.terminate()
              try:
                  driver.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  driver.kill()
                  driver.wait()
              server.shutdown()
          PY
      - name: Retain combined city export and browser evidence (not hosted)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arch002-persistent-city-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/arch002-persistent-city/
            ${{ runner.temp }}/arch002-city-browser-evidence/
          if-no-files-found: warn
          retention-days: 3
