name: Experiment setup checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup integrity (not game validation)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test coordination and setup tooling
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate repository setup
        run: python scripts/validate_setup.py
      - name: State validation scope
        run: |
          echo 'These checks cover experiment setup and coordination tooling only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'They do not establish that the game builds, runs, or has been playtested.' >> "$GITHUB_STEP_SUMMARY"
